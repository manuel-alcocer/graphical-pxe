# Boot menu catalog. After editing, run:  ./pxe build
#
# Each [[entry]] needs: id, type, label. Optional: category, args, extra_args,
# kernel, initrd, enabled = false. See './pxe types' for the supported types.
# Categories: linux-install, linux-live, windows-install, windows-live, tools
#
# ISOs are added with:  ./pxe import <file.iso> --type <type> --label "..."
# ('import' appends the entry here for you.)

# ---------------------------------------------------------------- netboot (no ISO needed)

[[entry]]
id = "debian-13-netinst"
type = "netboot"
label = "Debian 13 (trixie) - installer"
category = "linux-install"
kernel_url = "http://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/linux"
initrd_url = "http://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/initrd.gz"

[[entry]]
id = "alpine-live"
type = "netboot"
label = "Alpine Linux (live, RAM)"
category = "linux-live"
kernel_url = "http://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/netboot/vmlinuz-lts"
initrd_url = "http://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/netboot/initramfs-lts"
files = ["http://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/netboot/modloop-lts"]
args = "ip=dhcp modloop={base}/modloop-lts alpine_repo=http://dl-cdn.alpinelinux.org/alpine/latest-stable/main"

