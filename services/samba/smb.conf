[global]
   workgroup = WORKGROUP
   server string = PXE images
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

# Extracted ISO trees; Windows Setup (WinPE) reads install.wim from here
[images]
   path = /srv/images
   read only = yes
   browseable = yes
   valid users = @SMB_USER@
   # ISO files are extracted as 0644; let Windows run setup.exe anyway
   acl allow execute always = yes
   # Who mounts the share and which files they open, for the controller.
   # Written to the debug log (one line per event): <ip>|<machine>|<user>|<op>|<ok/fail>|<path>
   vfs objects = full_audit
   full_audit:prefix = %I|%m|%u
   full_audit:success = connect disconnect openat
   full_audit:failure = connect
   full_audit:syslog = false
   full_audit:log_level = 1
