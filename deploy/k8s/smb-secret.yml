# Credentials of the read-only SMB share Windows Setup (WinPE) mounts.
# Must match SMB_USER / SMB_PASS in the .env used for './pxe build': they are
# baked into install.cmd, which is served over plain HTTP (LAN-visible).
apiVersion: v1
kind: Secret
metadata:
  name: pxe-smb
  namespace: pxe
type: Opaque
stringData:
  username: pxe
  password: change-me

---
# Password of the control center web UI (user "admin").
apiVersion: v1
kind: Secret
metadata:
  name: pxe-admin
  namespace: pxe
type: Opaque
stringData:
  password: change-me-too
