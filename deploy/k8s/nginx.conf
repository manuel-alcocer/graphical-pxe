# Copy of services/http/nginx.conf
# One line per request for the controller (who downloaded what, how much).
log_format pxe_json escape=json
    '{"t":"$time_iso8601","ip":"$remote_addr","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time,"range":"$http_range",'
    '"ua":"$http_user_agent"}';

upstream pxe_controller {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/http;

    access_log /var/log/nginx/access.log;
    access_log /var/log/pxe/http.json pxe_json;

    autoindex on;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 0;

    # The menu is generated per client by the controller. If the controller is
    # down, fall back to the static full menu written by './pxe build'.
    location = /boot.ipxe {
        proxy_pass http://pxe_controller/ipxe/boot.ipxe;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_menu;
    }

    location @static_menu {
        rewrite ^ /boot.ipxe break;
    }

    location /ipxe/ {
        proxy_pass http://pxe_controller;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Only the iPXE endpoints of the controller are reachable here; its web UI
    # is published separately (behind authentication).
    location / {
        try_files $uri $uri/ =404;
    }
}
