# Serves the PXE tree (boot.ipxe menu, kernels, initrds, ISOs, boot.wim).
# Copy of services/http/nginx.conf
server {
    listen 80 default_server;
    server_name _;
    root /srv/http;

    autoindex on;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ =404;
    }
}
