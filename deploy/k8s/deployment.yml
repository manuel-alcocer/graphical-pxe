apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxe
  namespace: pxe
spec:
  replicas: 1
  strategy:
    # RWO volumes: the old pod must release them first.
    type: Recreate
  selector:
    matchLabels:
      app: pxe
  template:
    metadata:
      labels:
        app: pxe
    spec:
      containers:
        - name: http
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /srv/http
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: logs
              mountPath: /var/log/pxe
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10

        - name: smb
          image: pxe-samba
          ports:
            - name: smb
              containerPort: 445
          env:
            - name: SMB_USER
              valueFrom:
                secretKeyRef:
                  name: pxe-smb
                  key: username
            - name: SMB_PASS
              valueFrom:
                secretKeyRef:
                  name: pxe-smb
                  key: password
            # Audit log + smbstatus snapshots for the controller
            - name: PXE_LOG_DIR
              value: /var/log/pxe
          volumeMounts:
            - name: data
              mountPath: /srv/images
              subPath: images
              readOnly: true
            - name: logs
              mountPath: /var/log/pxe
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 10

        # Control center: per-client menus (nginx proxies /boot.ipxe and
        # /ipxe/* to it on localhost) and the web UI (Service pxe-controller).
        - name: controller
          image: pxe-controller
          ports:
            - name: controller
              containerPort: 8000
          env:
            - name: TZ
              value: UTC
            # Basic auth for the web UI (user "admin"); drop it if an
            # authenticating proxy (e.g. Authentik forward-auth) sits in front.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pxe-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /srv/http
              readOnly: true
            - name: logs
              mountPath: /var/log/pxe
            - name: controller-db
              mountPath: /var/lib/pxe-controller
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: controller
            periodSeconds: 10

        # Upload target for `./pxe push` (rsync over `kubectl exec`); the
        # samba image already carries rsync, so no extra image is needed.
        - name: sync
          image: pxe-samba
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: data
              mountPath: /srv/http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pxe-data
        - name: controller-db
          persistentVolumeClaim:
            claimName: pxe-controller
        - name: nginx-conf
          configMap:
            name: pxe-nginx
        # nginx JSON access log, samba audit log and smbstatus snapshots,
        # consumed (and truncated) by the controller.
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
