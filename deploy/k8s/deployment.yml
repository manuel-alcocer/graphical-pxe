apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxe
  namespace: pxe
spec:
  replicas: 1
  strategy:
    # RWO Longhorn volume: the old pod must release it first.
    type: Recreate
  selector:
    matchLabels:
      app: pxe
  template:
    metadata:
      labels:
        app: pxe
    spec:
      containers:
        - name: http
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /srv/http
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10

        - name: smb
          image: pxe-samba
          ports:
            - name: smb
              containerPort: 445
          env:
            - name: SMB_USER
              valueFrom:
                secretKeyRef:
                  name: pxe-smb
                  key: username
            - name: SMB_PASS
              valueFrom:
                secretKeyRef:
                  name: pxe-smb
                  key: password
          volumeMounts:
            - name: data
              mountPath: /srv/images
              subPath: images
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 10

        # Upload target for `./pxe push` (rsync over `kubectl exec`); the
        # samba image already carries rsync, so no extra image is needed.
        - name: sync
          image: pxe-samba
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: data
              mountPath: /srv/http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pxe-data
        - name: nginx-conf
          configMap:
            name: pxe-nginx
