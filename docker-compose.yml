# Graphical PXE server: ProxyDHCP + TFTP (dnsmasq/iPXE), HTTP (nginx), SMB (samba)
# and the control center (per-client menus, usage tracking).
# All services use host networking: DHCP/PXE needs to see broadcasts on the LAN.
services:
  dnsmasq:
    build: ./services/dnsmasq
    image: pxe-dnsmasq
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    env_file: .env
    restart: unless-stopped

  http:
    image: nginx:1.29-alpine
    network_mode: host
    volumes:
      - ./data/http:/srv/http:ro
      - ./data/logs:/var/log/pxe
      - ./services/http/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  smb:
    build: ./services/samba
    image: pxe-samba
    network_mode: host
    env_file: .env
    environment:
      PXE_LOG_DIR: /var/log/pxe
    volumes:
      - ./data/http/images:/srv/images:ro
      - ./data/logs:/var/log/pxe
    restart: unless-stopped

  # Web UI on port 8000 of this host: set ADMIN_PASSWORD in .env (user "admin").
  controller:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
    image: pxe-controller
    network_mode: host
    env_file: .env
    volumes:
      - ./data/http:/srv/http:ro
      - ./data/logs:/var/log/pxe
      - ./data/controller:/var/lib/pxe-controller
    restart: unless-stopped
