# Graphical PXE server: ProxyDHCP + TFTP (dnsmasq/iPXE), HTTP (nginx) and SMB (samba).
# All services use host networking: DHCP/PXE needs to see broadcasts on the LAN.
services:
  dnsmasq:
    build: ./services/dnsmasq
    image: pxe-dnsmasq
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    env_file: .env
    restart: unless-stopped

  http:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./data/http:/srv/http:ro
      - ./services/http/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  smb:
    build: ./services/samba
    image: pxe-samba
    network_mode: host
    env_file: .env
    volumes:
      - ./data/http/images:/srv/images:ro
    restart: unless-stopped
